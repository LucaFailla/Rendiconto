<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>Rendicontazione Viaggio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b14;
    --bg-gradient: linear-gradient(145deg, #0b0b14 0%, #1a1a2e 100%);
    --card: rgba(255, 255, 255, 0.05);
    --card-border: rgba(255, 255, 255, 0.1);
    --accent: #4ecca3;
    --text: #ffffff;
    --muted: #94a3b8;
    --danger: #ff4757;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    margin: 0; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); 
    min-height: 100vh; overflow-x: hidden;
  }

  .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-top: 60px; }
  header { margin-bottom: 30px; }
  h1 { font-family: 'DM Serif Display', serif; font-size: 2.5rem; margin: 0; letter-spacing: -1px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; }

  .actions-top { display: flex; gap: 10px; margin-bottom: 20px; }
  .btn-icon {
    flex: 1; background: var(--card); border: 1px solid var(--card-border); color: white;
    padding: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    gap: 8px; font-weight: 500; font-size: 0.85rem; cursor: pointer; transition: 0.2s;
  }
  .btn-icon:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
  .btn-add { background: var(--accent); color: #0b0b14; border: none; }

  .budget-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
  .bcard { 
    background: var(--card); border: 1px solid var(--card-border); padding: 15px 10px; 
    border-radius: 16px; text-align: center; cursor: pointer; transition: 0.2s;
  }
  .bcard-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
  .bcard-value { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
  .bcard-sub { font-size: 0.65rem; font-weight: 500; color: var(--accent); }
  .perc-badge { font-size: 0.6rem; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: var(--muted); display: block; margin-top: 4px;}

  .expense-item {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
  }
  .ex-info h4 { margin: 0; font-size: 0.95rem; font-weight: 600; }
  .ex-info p { margin: 2px 0 0; font-size: 0.75rem; color: var(--muted); }
  .ex-right { text-align: right; display: flex; align-items: center; gap: 10px; }
  .ex-cost-box { display: flex; flex-direction: column; align-items: flex-end; }
  .ex-cost { font-weight: 700; font-size: 1rem; }
  .ex-perc { font-size: 0.65rem; color: var(--accent); opacity: 0.8; }
  
  /* Modale */
  .modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: #1a1a2e; width: 90%; max-width: 400px; padding: 30px;
    border-radius: 24px; border: 1px solid var(--card-border);
  }
  input, select {
    width: 100%; background: var(--card); border: 1px solid var(--card-border);
    color: white; padding: 12px; border-radius: 10px; font-size: 1rem; margin-bottom: 15px;
  }
  .btn-confirm { width: 100%; background: var(--accent); color: #0b0b14; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="subtitle">Rendicontazione</div>
    <h1>Viaggio Vilnius</h1>
  </header>

  <div class="actions-top">
    <button class="btn-icon" onclick="exportExcel()">XLS</button>
    <button class="btn-icon" onclick="openModal('budget-modal')">Budget</button>
    <button class="btn-icon btn-add" onclick="prepareNewExpense()">+ Spesa</button>
  </div>

  <div class="budget-strip">
    <div class="bcard">
      <div class="bcard-label">Viaggio</div>
      <div class="bcard-value" id="hd-v-val">€0</div>
      <div id="hd-v-res" class="bcard-sub"></div>
      <span id="perc-v" class="perc-badge">0% del totale</span>
    </div>
    <div class="bcard">
      <div class="bcard-label">Supporto</div>
      <div class="bcard-value" id="hd-s-val">€0</div>
      <div id="hd-s-res" class="bcard-sub"></div>
      <span id="perc-s" class="perc-badge">0% del totale</span>
    </div>
    <div class="bcard">
      <div class="bcard-label">Totale</div>
      <div class="bcard-value" id="hd-t-val">€0</div>
      <div id="hd-t-max" class="bcard-sub" style="color:var(--muted)"></div>
    </div>
  </div>

  <div id="expense-list"></div>
</div>

<div id="add-modal" class="modal" onclick="closeOnOverlay(event, 'add-modal')">
  <div class="modal-content">
    <h2 id="modal-title">Nuova Spesa</h2>
    <label>Categoria</label>
    <select id="ex-tipo">
      <option value="Viaggio">Viaggio (Volo, Trasporti)</option>
      <option value="Supporto">Supporto (Vitto, Alloggio, Altro)</option>
    </select>
    <label>Descrizione</label>
    <input type="text" id="ex-desc" placeholder="es. Cena tipica">
    <label>Importo (€)</label>
    <input type="number" id="ex-costo" step="0.01" placeholder="0.00">
    <button class="btn-confirm" onclick="addExpense()">Salva</button>
  </div>
</div>

<div id="budget-modal" class="modal" onclick="closeOnOverlay(event, 'budget-modal')">
  <div class="modal-content">
    <h2>Budget</h2>
    <label>Budget Viaggio (€)</label>
    <input type="number" id="b-v" step="0.01">
    <label>Budget Supporto (€)</label>
    <input type="number" id="b-s" step="0.01">
    <button class="btn-confirm" onclick="saveBudget()">Aggiorna</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>

<script>
let state = JSON.parse(localStorage.getItem('tripData')) || {
  budget: { viaggio: 0, supporto: 0 },
  expenses: []
};
let editingId = null;

function save() {
  localStorage.setItem('tripData', JSON.stringify(state));
  render();
}

function prepareNewExpense() {
  editingId = null;
  document.getElementById('modal-title').innerText = 'Nuova Spesa';
  document.getElementById('ex-desc').value = '';
  document.getElementById('ex-costo').value = '';
  openModal('add-modal');
}

function editExpense(id) {
  const exp = state.expenses.find(e => e.id === id);
  if (!exp) return;
  editingId = id;
  document.getElementById('modal-title').innerText = 'Modifica Spesa';
  document.getElementById('ex-tipo').value = exp.tipo;
  document.getElementById('ex-desc').value = exp.desc;
  document.getElementById('ex-costo').value = exp.costo;
  openModal('add-modal');
}

function addExpense() {
  const tipo = document.getElementById('ex-tipo').value;
  const desc = document.getElementById('ex-desc').value;
  const costo = parseFloat(document.getElementById('ex-costo').value) || 0;
  if (editingId) {
    state.expenses = state.expenses.map(e => e.id === editingId ? {...e, tipo, desc, costo} : e);
  } else {
    state.expenses.push({ id: Date.now(), tipo, desc, costo });
  }
  closeModal('add-modal');
  save();
}

function deleteExpense(id) {
  if(confirm('Eliminare questa spesa?')) {
    state.expenses = state.expenses.filter(e => e.id !== id);
    save();
  }
}

function saveBudget() {
  state.budget.viaggio = parseFloat(document.getElementById('b-v').value) || 0;
  state.budget.supporto = parseFloat(document.getElementById('b-s').value) || 0;
  closeModal('budget-modal');
  save();
}

function openModal(id) { 
  document.getElementById(id).classList.add('open'); 
  if(id === 'budget-modal') {
    document.getElementById('b-v').value = state.budget.viaggio;
    document.getElementById('b-s').value = state.budget.supporto;
  }
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeOnOverlay(e, id) { if(e.target.id === id) closeModal(id); }

function render() {
  const vTot = state.expenses.filter(e => e.tipo === 'Viaggio').reduce((a,b) => a + b.costo, 0);
  const sTot = state.expenses.filter(e => e.tipo === 'Supporto').reduce((a,b) => a + b.costo, 0);
  const totalSpent = vTot + sTot;
  
  // Update Header values
  document.getElementById('hd-v-val').innerText = `€${vTot.toFixed(2)}`;
  document.getElementById('hd-v-res').innerText = `Dif. €${(state.budget.viaggio - vTot).toFixed(2)}`;
  document.getElementById('perc-v').innerText = totalSpent > 0 ? `${((vTot/totalSpent)*100).toFixed(0)}% del totale` : '0% del totale';

  document.getElementById('hd-s-val').innerText = `€${sTot.toFixed(2)}`;
  document.getElementById('hd-s-res').innerText = `Dif. €${(state.budget.supporto - sTot).toFixed(2)}`;
  document.getElementById('perc-s').innerText = totalSpent > 0 ? `${((sTot/totalSpent)*100).toFixed(0)}% del totale` : '0% del totale';

  document.getElementById('hd-t-val').innerText = `€${totalSpent.toFixed(2)}`;
  document.getElementById('hd-t-max').innerText = `su €${(state.budget.viaggio + state.budget.supporto).toFixed(2)}`;

  const list = document.getElementById('expense-list');
  list.innerHTML = state.expenses.length ? '' : '<p style="color:var(--muted); text-align:center;">Nessuna spesa.</p>';
  
  [...state.expenses].reverse().forEach(e => {
    const catTotal = e.tipo === 'Viaggio' ? vTot : sTot;
    const percOnCat = catTotal > 0 ? ((e.costo / catTotal) * 100).toFixed(1) : 0;
    
    const div = document.createElement('div');
    div.className = 'expense-item';
    div.innerHTML = `
      <div class="ex-info">
        <h4>${e.desc || 'Senza descrizione'}</h4>
        <p>${e.tipo} • ${new Date(e.id).toLocaleDateString()}</p>
      </div>
      <div class="ex-right">
        <div class="ex-cost-box">
            <span class="ex-cost">€${e.costo.toFixed(2)}</span>
            <span class="ex-perc">${percOnCat}% cat.</span>
        </div>
        <button class="btn-action btn-edit" onclick="editExpense(${e.id})">✏️</button>
        <button class="btn-action btn-del" onclick="deleteExpense(${e.id})">🗑️</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function exportExcel() {
  if (typeof XLSX === 'undefined') return alert("Caricamento libreria...");
  const vTot = state.expenses.filter(e => e.tipo === 'Viaggio').reduce((a,b) => a + b.costo, 0);
  const sTot = state.expenses.filter(e => e.tipo === 'Supporto').reduce((a,b) => a + b.costo, 0);
  const tTot = vTot + sTot;

  const data = [
    ['REPORT VIAGGIO'],
    ['Categoria', 'Budget', 'Speso', 'Differenza', '% Incidenza'],
    ['Viaggio', state.budget.viaggio, vTot, state.budget.viaggio - vTot, tTot > 0 ? (vTot/tTot) : 0],
    ['Supporto', state.budget.supporto, sTot, state.budget.supporto - sTot, tTot > 0 ? (sTot/tTot) : 0],
    [''],
    ['Dettaglio Spese'],
    ['Data', 'Categoria', 'Descrizione', 'Importo (€)', '% su Categoria']
  ];
  
  state.expenses.forEach(e => {
    const catTot = e.tipo === 'Viaggio' ? vTot : sTot;
    data.push([new Date(e.id).toLocaleDateString(), e.tipo, e.desc, e.costo, e.costo/catTot]);
  });

  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Report");
  XLSX.writeFile(wb, "Rendiconto.xlsx");
}

window.onload = render;
</script>
</body>
</html>
