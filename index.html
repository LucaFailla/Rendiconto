<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vilnius STT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vilnius STT</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b14;
    --bg-gradient: linear-gradient(145deg, #0b0b14 0%, #1a1a2e 100%);
    --card: rgba(255, 255, 255, 0.05);
    --card-border: rgba(255, 255, 255, 0.1);
    --glass-bg: rgba(26, 26, 46, 0.85);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.5);
    --accent: #e8c547;
    --green: #4ecb8d;
    --red: #ff5e5e;
    --blue: #5b9bd5;
    --radius: 20px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body { 
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text); 
    font-family: 'DM Sans', sans-serif; 
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* Layout & Header */
  .header { 
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: calc(20px + var(--safe-top)) 20px 15px; 
    border-bottom: 1px solid var(--card-border);
    flex-shrink: 0;
    z-index: 10;
  }

  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  
  .header-title { 
    font-family: 'DM Serif Display', serif; 
    font-size: 24px; 
    letter-spacing: -0.5px;
  }
  .header-title span { color: var(--accent); }

  .actions-top { display: flex; gap: 8px; }
  
  .btn-icon {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  
  .btn-add { background: var(--accent); color: #0b0b14; border: none; font-weight: 700; }

  /* Budget Strip */
  .budget-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .bcard { 
    background: var(--card); 
    border-radius: 16px; 
    padding: 12px; 
    border: 1px solid var(--card-border);
    text-align: center;
  }
  .bcard-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .bcard-value { font-size: 15px; font-weight: 700; }
  .bcard-sub { font-size: 9px; margin-top: 3px; font-weight: 500; }
  .ok { color: var(--green); }
  .over { color: var(--red); }

  /* Content Area */
  .content { 
    flex: 1; 
    overflow-y: auto; 
    padding: 20px 20px calc(30px + var(--safe-bottom));
    -webkit-overflow-scrolling: touch;
  }

  /* Progress Section */
  .progress-wrap { 
    background: var(--card); 
    border-radius: var(--radius); 
    padding: 18px; 
    border: 1px solid var(--card-border); 
    margin-bottom: 24px; 
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .progress-row { margin-bottom: 12px; }
  .progress-row:last-child { margin-bottom: 0; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .progress-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 15px; font-weight: 600; }

  /* Expense List */
  .expense-list { display: flex; flex-direction: column; gap: 12px; }
  .expense-item { 
    background: var(--card); 
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border-radius: 18px; 
    padding: 14px; 
    border: 1px solid var(--card-border); 
    display: flex; 
    align-items: center; 
    gap: 14px; 
    transition: transform 0.2s;
  }
  .expense-item:active { transform: scale(0.97); }

  .exp-icon { 
    width: 44px; height: 44px; border-radius: 14px; 
    display: flex; align-items: center; justify-content: center; 
    font-size: 18px; background: rgba(255,255,255,0.03);
    flex-shrink: 0;
  }
  
  .exp-info { flex: 1; min-width: 0; }
  .exp-desc { font-size: 15px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp-type { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .exp-amount { font-size: 16px; font-weight: 700; text-align: right; }

  .btn-del { 
    background: rgba(255,94,94,0.1); border: none; width: 30px; height: 30px; 
    border-radius: 10px; color: var(--red); font-size: 14px; cursor: pointer;
  }

  /* Modals */
  .modal-overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
    backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: flex-end; 
    opacity: 0; pointer-events: none; transition: 0.3s; 
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  
  .modal { 
    background: #161625; width: 100%; border-radius: 30px 30px 0 0; 
    padding: 25px 25px calc(30px + var(--safe-bottom)); 
    transform: translateY(100%); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
    border-top: 1px solid var(--card-border);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  
  .modal-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.1); border-radius: 99px; margin: 0 auto 25px; }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 20px; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
  .field input, .field select { 
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); 
    border-radius: 14px; padding: 14px; font-size: 16px; color: #fff; outline: none; 
  }
  .btn-submit { 
    width: 100%; background: var(--accent); color: #0b0b14; border: none; 
    border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 700; 
    margin-top: 10px; box-shadow: 0 4px 15px rgba(232, 197, 71, 0.3);
  }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state div { font-size: 40px; margin-bottom: 15px; opacity: 0.5; }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">Vilnius <span>STT</span></div>
    <div class="actions-top">
      <button class="btn-icon" onclick="exportExcel()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        XLS
      </button>
      <button class="btn-icon btn-add" onclick="openModal('add-modal')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
        Nuova
      </button>
    </div>
  </div>
  
  <div class="budget-strip">
    <div class="bcard">
      <div class="bcard-label">Viaggio</div>
      <div class="bcard-value" id="hd-v-val">€0</div>
      <div id="hd-v-res" class="bcard-sub"></div>
    </div>
    <div class="bcard" onclick="openModal('budget-modal')" style="cursor:pointer">
      <div class="bcard-label">Supporto</div>
      <div class="bcard-value" id="hd-s-val">€0</div>
      <div id="hd-s-res" class="bcard-sub"></div>
    </div>
    <div class="bcard">
      <div class="bcard-label">Totale</div>
      <div class="bcard-value" id="hd-t-val">€0</div>
      <div id="hd-t-max" class="bcard-sub" style="color:var(--muted)"></div>
    </div>
  </div>
</div>

<div class="content">
  <div class="progress-wrap">
    <div class="progress-row">
      <div class="progress-label"><span>Budget Viaggio</span><span id="p-v-pct">0%</span></div>
      <div class="progress-track"><div id="p-v-fill" class="progress-fill" style="background:var(--accent)"></div></div>
    </div>
    <div class="progress-row" style="margin-top:15px">
      <div class="progress-label"><span>Budget Supporto</span><span id="p-s-pct">0%</span></div>
      <div class="progress-track"><div id="p-s-fill" class="progress-fill" style="background:var(--green)"></div></div>
    </div>
  </div>

  <div class="section-title">Lista Spese</div>
  <div id="expense-list" class="expense-list"></div>
</div>

<div class="modal-overlay" id="add-modal" onclick="closeOnOverlay(event, 'add-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Aggiungi Spesa</div>
    <div class="field">
      <label>Categoria</label>
      <select id="f-tipo">
        <option value="Viaggio">✈️ Viaggio</option>
        <option value="Alloggio">🏨 Alloggio</option>
        <option value="Vitto">🍽️ Vitto</option>
        <option value="Altro">📌 Altro</option>
      </select>
    </div>
    <div class="field">
      <label>Descrizione</label>
      <input type="text" id="f-desc" placeholder="es. Cena tipica">
    </div>
    <div class="field">
      <label>Importo (€)</label>
      <input type="number" id="f-costo" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
    <button class="btn-submit" onclick="addExpense()">Salva Spesa</button>
  </div>
</div>

<div class="modal-overlay" id="budget-modal" onclick="closeOnOverlay(event, 'budget-modal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Imposta Budget</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
      <div class="field">
        <label>Viaggio (€)</label>
        <input type="number" id="b-v" placeholder="395">
      </div>
      <div class="field">
        <label>Supporto (€)</label>
        <input type="number" id="b-s" placeholder="826">
      </div>
    </div>
    <button class="btn-submit" onclick="saveBudget()">Aggiorna Budget</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const TIPO_ICON = { Viaggio: '✈️', Alloggio: '🏨', Vitto: '🍽️', Altro: '📌' };
let state = JSON.parse(localStorage.getItem('rendiconto_stt')) || {
  budget: { viaggio: 395, supporto: 826 },
  expenses: []
};

function save() { localStorage.setItem('rendiconto_stt', JSON.stringify(state)); render(); }
function fmt(n) { return '€' + n.toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function render() {
  const vTot = state.expenses.filter(e => e.tipo === 'Viaggio').reduce((a,b) => a + b.costo, 0);
  const sTot = state.expenses.filter(e => e.tipo !== 'Viaggio').reduce((a,b) => a + b.costo, 0);
  const vRes = state.budget.viaggio - vTot;
  const sRes = state.budget.supporto - sTot;

  // Update Headers
  document.getElementById('hd-v-val').textContent = fmt(vTot);
  document.getElementById('hd-v-res').innerHTML = `<span class="${vRes < 0 ? 'over' : 'ok'}">${vRes >= 0 ? '+' : ''}${fmt(vRes)}</span>`;
  
  document.getElementById('hd-s-val').textContent = fmt(sTot);
  document.getElementById('hd-s-res').innerHTML = `<span class="${sRes < 0 ? 'over' : 'ok'}">${sRes >= 0 ? '+' : ''}${fmt(sRes)}</span>`;
  
  document.getElementById('hd-t-val').textContent = fmt(vTot + sTot);
  document.getElementById('hd-t-max').textContent = 'su ' + fmt(state.budget.viaggio + state.budget.supporto);

  // Update Progress
  const vPct = Math.min(100, (vTot / state.budget.viaggio * 100) || 0);
  const sPct = Math.min(100, (sTot / state.budget.supporto * 100) || 0);
  
  document.getElementById('p-v-pct').textContent = vPct.toFixed(0) + '%';
  document.getElementById('p-v-fill').style.width = vPct + '%';
  document.getElementById('p-v-fill').style.background = vPct >= 100 ? 'var(--red)' : 'var(--accent)';
  
  document.getElementById('p-s-pct').textContent = sPct.toFixed(0) + '%';
  document.getElementById('p-s-fill').style.width = sPct + '%';
  document.getElementById('p-s-fill').style.background = sPct >= 100 ? 'var(--red)' : 'var(--green)';

  // Render List
  const list = document.getElementById('expense-list');
  if (state.expenses.length === 0) {
    list.innerHTML = '<div class="empty-state"><div>☁️</div>Nessuna spesa salvata</div>';
    return;
  }
  list.innerHTML = state.expenses.map(e => `
    <div class="expense-item">
      <div class="exp-icon">${TIPO_ICON[e.tipo]}</div>
      <div class="exp-info">
        <div class="exp-desc">${e.desc}</div>
        <div class="exp-type">${e.tipo}</div>
      </div>
      <div class="exp-amount">${fmt(e.costo)}</div>
      <button class="btn-del" onclick="deleteExpense(${e.id})">✕</button>
    </div>
  `).join('');
}

function addExpense() {
  const tipo = document.getElementById('f-tipo').value;
  const desc = document.getElementById('f-desc').value.trim();
  const costo = parseFloat(document.getElementById('f-costo').value);
  if (!desc || !costo) return;
  state.expenses.unshift({ id: Date.now(), tipo, desc, costo });
  document.getElementById('f-desc').value = '';
  document.getElementById('f-costo').value = '';
  closeModal('add-modal');
  save();
}

function deleteExpense(id) {
  state.expenses = state.expenses.filter(e => e.id !== id);
  save();
}

function saveBudget() {
  state.budget.viaggio = parseFloat(document.getElementById('b-v').value) || 0;
  state.budget.supporto = parseFloat(document.getElementById('b-s').value) || 0;
  closeModal('budget-modal');
  save();
}

function openModal(id) { 
  document.getElementById(id).classList.add('open'); 
  if(id === 'budget-modal') {
    document.getElementById('b-v').value = state.budget.viaggio;
    document.getElementById('b-s').value = state.budget.supporto;
  }
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeOnOverlay(e, id) { if(e.target.id === id) closeModal(id); }

function exportExcel() {
  const vTot = state.expenses.filter(e => e.tipo === 'Viaggio').reduce((a,b) => a + b.costo, 0);
  const sTot = state.expenses.filter(e => e.tipo !== 'Viaggio').reduce((a,b) => a + b.costo, 0);
  const tTot = vTot + sTot;
  const bTot = state.budget.viaggio + state.budget.supporto;

  // 1. Prepariamo i dati con una struttura più pulita e spaziata
  const data = [
    ['REPORT RENDICONTAZIONE VIAGGIO - VILNIUS STT'],
    ['Data esportazione:', new Date().toLocaleDateString('it-IT')],
    [''],
    ['RIEPILOGO BUDGET', '', '', ''],
    ['Categoria', 'Budget Previsto', 'Totale Speso', 'Residuo'],
    ['Viaggio', state.budget.viaggio, vTot, state.budget.viaggio - vTot],
    ['Supporto', state.budget.supporto, sTot, state.budget.supporto - sTot],
    ['TOTALE GENERALE', bTot, tTot, bTot - tTot],
    [''],
    ['DETTAGLIO SPESE ANALITICO', '', '', ''],
    ['Data', 'Categoria', 'Descrizione', 'Importo (€)']
  ];
  
  // Aggiungiamo le spese formattando bene la data
  state.expenses.forEach(e => {
    data.push([
      new Date(e.id).toLocaleDateString('it-IT'), 
      e.tipo.toUpperCase(), 
      e.desc, 
      e.costo
    ]);
  });

  // 2. Creazione del foglio
  const ws = XLSX.utils.aoa_to_sheet(data);

  // 3. DEFINIZIONE LARGHEZZA COLONNE (Il vero trucco per l'ordine!)
  // wch è la larghezza approssimativa in caratteri
  ws['!cols'] = [
    { wch: 15 }, // Colonna A (Data)
    { wch: 20 }, // Colonna B (Categoria / Budget)
    { wch: 35 }, // Colonna C (Descrizione / Speso)
    { wch: 15 }  // Colonna D (Importo / Residuo)
  ];

  // 4. Creazione del Workbook e salvataggio
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Resoconto Spese");
  
  // Genera il file con un nome che include la data per non sovrascriverli
  const fileName = `Vilnius_Report_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fileName);
}

// Service Worker Registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
