<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Vilnius STT</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    --bg: #0f0f1a;
    --accent: #70e0af;
    --accent-dark: #4ecca3;
    --card-bg: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --text-dim: #94a3b8;
    --danger: #ff6b6b;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body { 
    margin: 0; 
    font-family: 'Outfit', sans-serif; 
    background-color: var(--bg); 
    background-image: radial-gradient(circle at 0% 0%, rgba(112, 224, 175, 0.05) 0%, transparent 50%),
                      radial-gradient(circle at 100% 100%, rgba(112, 224, 175, 0.05) 0%, transparent 50%);
    color: var(--text); 
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .app-container {
    width: 100%;
    max-width: 480px;
    padding: 40px 20px;
  }

  header { margin-bottom: 35px; }

  .brand {
    font-family: 'DM Serif Display', serif;
    font-size: 2.8rem;
    line-height: 1;
    margin: 0;
    background: linear-gradient(to bottom right, #fff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tagline {
    color: var(--accent);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 30px;
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 4px;
    background: var(--accent);
    opacity: 0.5;
  }

  .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
  .value { font-size: 1.4rem; font-weight: 700; margin: 5px 0; }
  .diff { font-size: 0.75rem; color: var(--accent); font-weight: 500; transition: color 0.3s ease; }
  .diff.negative { color: var(--danger); font-weight: 700; }
  
  .perc-tag {
    margin-top: 12px;
    display: inline-block;
    font-size: 0.65rem;
    padding: 4px 10px;
    background: rgba(112, 224, 175, 0.1);
    color: var(--accent);
    border-radius: 100px;
    font-weight: 600;
  }

  .btn-group { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 10px; 
    margin-bottom: 15px; 
  }
  
  .btn {
    padding: 14px;
    border-radius: 18px;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-primary { background: var(--accent); color: #0b0b14; grid-column: span 2; padding: 18px; font-size: 1rem; }
  .btn-secondary { background: var(--card-bg); color: white; border: 1px solid var(--border); }
  .btn-danger { background: rgba(255, 107, 107, 0.1); color: var(--danger); border: 1px solid rgba(255, 107, 107, 0.2); margin-top: 10px; }
  .btn:active { transform: scale(0.96); }

  .list-title { font-size: 1rem; font-weight: 600; margin: 25px 0 15px 0; color: var(--text-dim); }
  
  .expense-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: fadeIn 0.4s ease forwards;
    cursor: pointer;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .ex-name { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
  .ex-info { font-size: 0.7rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 2px; }
  .ex-date { font-weight: 400; opacity: 0.8; }
  .ex-cat { display: flex; align-items: center; gap: 5px; }
  .ex-cat::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

  .ex-amount-box { text-align: right; }
  .ex-amount { font-weight: 700; font-size: 1.1rem; display: block; }
  .ex-edit-label { font-size: 0.6rem; color: var(--accent); text-transform: uppercase; font-weight: 700; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: #161625; width: 90%; max-width: 400px; padding: 30px; 
    border-radius: 30px; border: 1px solid var(--border);
  }
  
  input, select {
    width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--border);
    background: #0b0b14; color: white; margin-bottom: 15px; font-family: inherit; font-size: 1rem;
  }

  .empty-state { text-align: center; color: var(--text-dim); margin-top: 40px; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="tagline">Mission Rendiconto</div>
    <h1 class="brand">Vilnius STT</h1>
  </header>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="openAddModal()">＋ Nuova Spesa</button>
    <button class="btn btn-secondary" onclick="openBudgetModal()">⚙️ Budget</button>
    <button class="btn btn-secondary" onclick="downloadExcel()">📊 Esporta</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Viaggio</div>
      <div class="value" id="v-val">€0.00</div>
      <div id="v-diff" class="diff">Rest: €0</div>
      <div id="v-perc" class="perc-tag">0% budget</div>
    </div>
    <div class="stat-card">
      <div class="label">Supporto</div>
      <div class="value" id="s-val">€0.00</div>
      <div id="s-diff" class="diff">Rest: €0</div>
      <div id="s-perc" class="perc-tag">0% budget</div>
    </div>
  </div>

  <div class="list-title">Ultime Spese</div>
  <div id="expense-list"></div>
</div>

<div id="add-modal" class="modal" onclick="if(event.target==this) closeModal('add-modal')">
  <div class="modal-content">
    <h2 id="modal-title" style="margin-top:0">Nuova Spesa</h2>
    <input type="hidden" id="edit-id">
    <select id="ex-tipo">
      <option value="Viaggio">✈️ Viaggio</option>
      <option value="Supporto">🏠 Supporto</option>
    </select>
    <input type="text" id="ex-desc" placeholder="Descrizione (es. Cena)">
    <input type="number" step="0.01" id="ex-costo" placeholder="Importo (€)">
    <button class="btn btn-primary" style="width:100%" onclick="saveExpense()" id="btn-save">Salva</button>
    <button class="btn btn-danger" id="btn-delete" style="display:none; width:100%" onclick="deleteExpense()">Elimina Spesa</button>
  </div>
</div>

<div id="budget-modal" class="modal" onclick="if(event.target==this) closeModal('budget-modal')">
  <div class="modal-content">
    <h2 style="margin-top:0">Imposta Budget</h2>
    <label class="label">Budget Viaggio</label>
    <input type="number" id="b-v">
    <label class="label">Budget Supporto</label>
    <input type="number" id="b-s">
    <button class="btn btn-primary" style="width:100%" onclick="saveBudget()">Salva</button>
  </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem('vilniusData')) || {
  budget: { viaggio: 0, supporto: 0 },
  expenses: []
};

// --- MODALS ---
function closeModal(id) { 
    document.getElementById(id).classList.remove('open');
    document.getElementById('edit-id').value = '';
    document.getElementById('btn-delete').style.display = 'none';
    document.getElementById('modal-title').innerText = 'Nuova Spesa';
}

function openAddModal() {
    document.getElementById('ex-desc').value = '';
    document.getElementById('ex-costo').value = '';
    document.getElementById('add-modal').classList.add('open');
}

function openBudgetModal() {
    document.getElementById('b-v').value = state.budget.viaggio;
    document.getElementById('b-s').value = state.budget.supporto;
    document.getElementById('budget-modal').classList.add('open');
}

function openEditModal(id) {
    const ex = state.expenses.find(e => e.id === id);
    if(!ex) return;
    document.getElementById('edit-id').value = ex.id;
    document.getElementById('ex-tipo').value = ex.tipo;
    document.getElementById('ex-desc').value = ex.desc;
    document.getElementById('ex-costo').value = ex.costo;
    document.getElementById('modal-title').innerText = 'Modifica Spesa';
    document.getElementById('btn-delete').style.display = 'block';
    document.getElementById('add-modal').classList.add('open');
}

// --- DATA ---
function saveExpense() {
  const id = document.getElementById('edit-id').value;
  const tipo = document.getElementById('ex-tipo').value;
  const desc = document.getElementById('ex-desc').value || 'Spesa';
  const costo = parseFloat(document.getElementById('ex-costo').value) || 0;
  const today = new Date().toLocaleDateString('it-IT');

  if(costo <= 0) return;

  if(id) {
    const idx = state.expenses.findIndex(e => e.id == id);
    state.expenses[idx] = { ...state.expenses[idx], tipo, desc, costo };
  } else {
    state.expenses.push({ id: Date.now(), tipo, desc, costo, date: today });
  }
  save();
  closeModal('add-modal');
}

function deleteExpense() {
    const id = document.getElementById('edit-id').value;
    if(confirm('Eliminare?')) {
        state.expenses = state.expenses.filter(e => e.id != id);
        save();
        closeModal('add-modal');
    }
}

function saveBudget() {
  state.budget.viaggio = parseFloat(document.getElementById('b-v').value) || 0;
  state.budget.supporto = parseFloat(document.getElementById('b-s').value) || 0;
  save();
  closeModal('budget-modal');
}

function save() {
  localStorage.setItem('vilniusData', JSON.stringify(state));
  render();
}

// --- EXCEL EXPORT ---
function downloadExcel() {
    if (state.expenses.length === 0) {
        alert("Non ci sono spese da esportare!");
        return;
    }

    // 1. Prepariamo i dati della tabella spese
    const dataTable = state.expenses.map(e => ({
        'Data': e.date,
        'Categoria': e.tipo,
        'Descrizione': e.desc,
        'Importo (€)': e.costo.toFixed(2)
    }));

    // 2. Prepariamo il riepilogo
    const vTot = state.expenses.filter(e => e.tipo === 'Viaggio').reduce((a,b) => a + b.costo, 0);
    const sTot = state.expenses.filter(e => e.tipo === 'Supporto').reduce((a,b) => a + b.costo, 0);
    
    const summaryTable = [
        {}, // Riga vuota
        {'Data': 'RIEPILOGO FINALE'},
        {'Data': 'Categoria', 'Categoria': 'Budget', 'Descrizione': 'Speso', 'Importo (€)': 'Rimanente'},
        {'Data': 'Viaggio', 'Categoria': state.budget.viaggio.toFixed(2), 'Descrizione': vTot.toFixed(2), 'Importo (€)': (state.budget.viaggio - vTot).toFixed(2)},
        {'Data': 'Supporto', 'Categoria': state.budget.supporto.toFixed(2), 'Descrizione': sTot.toFixed(2), 'Importo (€)': (state.budget.supporto - sTot).toFixed(2)},
        {'Data': 'TOTALE GENERALE', 'Categoria': (state.budget.viaggio + state.budget.supporto).toFixed(2), 'Descrizione': (vTot + sTot).toFixed(2), 'Importo (€)': ((state.budget.viaggio + state.budget.supporto) - (vTot + sTot)).toFixed(2)}
    ];

    // Uniamo le due parti
    const fullData = [...dataTable, ...summaryTable];

    // Creazione Workbook
    const worksheet = XLSX.utils.json_to_sheet(fullData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Rendiconto Vilnius");

    // Download
    XLSX.writeFile(workbook, `Rendiconto_Missione_Vilnius.xlsx`);
}

function render() {
  const vTot = state.expenses.filter(e => e.tipo === 'Viaggio').reduce((a,b) => a + b.costo, 0);
  const sTot = state.expenses.filter(e => e.tipo === 'Supporto').reduce((a,b) => a + b.costo, 0);

  const vDiff = state.budget.viaggio - vTot;
  const sDiff = state.budget.supporto - sTot;

  document.getElementById('v-val').innerText = `€${vTot.toFixed(2)}`;
  document.getElementById('v-diff').innerText = `Rest: €${vDiff.toFixed(2)}`;
  document.getElementById('v-diff').classList.toggle('negative', vDiff < 0);
  const vP = state.budget.viaggio > 0 ? Math.round((vTot/state.budget.viaggio)*100) : 0;
  document.getElementById('v-perc').innerText = `${vP}% budget`;

  document.getElementById('s-val').innerText = `€${sTot.toFixed(2)}`;
  document.getElementById('s-diff').innerText = `Rest: €${sDiff.toFixed(2)}`;
  document.getElementById('s-diff').classList.toggle('negative', sDiff < 0);
  const sP = state.budget.supporto > 0 ? Math.round((sTot/state.budget.supporto)*100) : 0;
  document.getElementById('s-perc').innerText = `${sP}% budget`;

  const list = document.getElementById('expense-list');
  if (state.expenses.length === 0) {
    list.innerHTML = '<div class="empty-state">Nessuna spesa.</div>';
    return;
  }

  list.innerHTML = '';
  [...state.expenses].reverse().forEach(e => {
    list.innerHTML += `
      <div class="expense-card" onclick="openEditModal(${e.id})">
        <div>
          <div class="ex-name">${e.desc}</div>
          <div class="ex-info">
             <span class="ex-cat">${e.tipo}</span>
             <span class="ex-date">${e.date}</span>
          </div>
        </div>
        <div class="ex-amount-box">
          <span class="ex-amount">€${e.costo.toFixed(2)}</span>
          <span class="ex-edit-label">Modifica</span>
        </div>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
